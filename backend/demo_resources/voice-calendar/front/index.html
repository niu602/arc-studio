<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>语音日程管理系统</title>
  
  <link
    rel="stylesheet"
    href="https://unpkg.com/element-plus/dist/index.css"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.9/index.global.min.css"
  />
 
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      background-color: #f5f7fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden; /* 防止页面滚动 */
    }
    
    #app {
      width: 100%;
      height: 100%;
    }
    
    /* 页面加载动画（简洁美观）- 会在Vue挂载后自动隐藏 */
    .loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    
    .loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    
    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(64, 158, 255, 0.1);
      border-top: 4px solid #409eff;
      border-radius: 50%;
      animation: rotate 0.8s linear infinite;
      margin-bottom: 20px;
    }
    
    .loading-text {
      color: #606266;
      font-size: 16px;
      font-weight: 500;
      animation: pulse 1.5s ease-in-out infinite;
    }
    
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <!-- 挂载点 -->
  <div id="app">
    <!-- 增强的加载动画 -->
    <div class="loading" id="loading-screen">
      <div class="loading-spinner"></div>
      <div class="loading-text">正在加载语音日程管理系统...</div>
    </div>
  </div>
  
  <!-- 注意：Vite使用ES模块，路径基于项目根目录 -->
  <script type="module" src="/src/main.js"></script>
  
  <script>
    // 全局错误处理
    window.addEventListener('error', function(e) {
      console.error('页面错误:', e.error || e.message);
      
      // 如果应用加载失败，显示错误信息
      const loading = document.getElementById('loading-screen');
      if (loading && !loading.classList.contains('hidden')) {
        setTimeout(() => {
          loading.innerHTML = `
            <div style="text-align: center; padding: 20px;">
              <div style="color: #f56c6c; font-size: 48px; margin-bottom: 20px;">⚠️</div>
              <h3 style="color: #303133; margin-bottom: 10px;">应用加载失败</h3>
              <p style="color: #606266; margin-bottom: 20px;">请检查控制台错误信息</p>
              <button onclick="location.reload()" style="
                background: #409eff;
                color: white;
                border: none;
                padding: 10px 20px;
                border-radius: 4px;
                cursor: pointer;
              ">重新加载</button>
            </div>
          `;
        }, 3000);
      }
    });
    
    // 如果5秒后Vue仍未挂载，显示提示
    setTimeout(() => {
      const appContent = document.querySelector('#app > *:not(.loading)');
      const loading = document.getElementById('loading-screen');
      
      if (!appContent && loading && !loading.classList.contains('hidden')) {
        console.warn('Vue应用加载较慢，请检查控制台...');
      }
    }, 5000);
  </script>
</body>
</html>
