schema_version: "1.0"
id: web-react-express
name: Web Application (React + Express)
type: web_app
version: 1.0.0
description: Full-stack React and Express application template for generation agents.
stack:
  frontend:
    framework: Vite
    library: React
    language: JavaScript
    styling: TailwindCSS
  backend:
    framework: Express
    language: JavaScript
    database: SQLite
  tests:
    frontend: Vitest
    backend: Vitest
    e2e: Playwright
copy:
  exclude:
    - template.yaml
    - frontend/node_modules
    - frontend/dist
    - backend/node_modules
    - backend/.arc-test-db
preview:
  html: frontend/dist/index.html
  assets: frontend/dist/assets
agent_guidance:
  ui_root: frontend/src
  api_root: backend/src/app.js
  function_root: backend/src
  db_root: backend/src/database
  frontend_test_root: frontend/src
  backend_test_root: backend/src
  e2e_test_root: backend/test-e2e
  accessibility_contract: |
    Every interactive control MUST expose a correct ARIA role and an accessible
    name that exactly matches the quoted English wording in the requirement.
    Prefer native semantic elements (<button>, <a>, <input> + <label htmlFor>,
    <select>, <nav>, <table>) over custom role attributes. For composite widgets:
    use role="tablist"/"tab" with aria-selected, role="grid"/"gridcell" with
    aria-label="Worksheet grid" and coordinate cell names (e.g. "A1"), and
    role="menu"/"menuitem" for dropdowns. Never expose a control only by testid;
    every testable control needs a role + accessible name reachable via
    getByRole/getByLabel/getByPlaceholder/getByText.
